name: Publish

# Stages a release on npm when a version tag is pushed. main only takes pull requests, so the version bump goes through
# a PR: npm version <bump> --no-git-tag-version, and in CHANGELOG.md the Unreleased entries move under the new version,
# along with any ccusage bump Renovate automerged since the last tag (git log v<last>.. -- package.json). Once it is
# merged, the merge is tagged from an up-to-date main (git tag v<version> && git push origin v<version>). The release
# goes public only once a maintainer approves it with 2FA (npm stage approve <id>, or on npmjs.com), so this workflow
# can never release on its own. Authenticates with npm trusted publishing (OIDC), so there is no npm token secret, and
# npm attaches provenance automatically. The trusted publisher on npmjs.com must name this repository and this workflow
# file, and needs neither "Allow npm publish" nor "Allow npm dist-tag".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm exchange the GitHub OIDC token for a short-lived publish credential
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # its bundled npm supports trusted publishing and npm stage
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci # also builds dist/ via prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm stage publish
