name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # also builds dist/ via prepare
      - run: npm run typecheck
      - run: npm test
      - run: node dist/cli.js --version

  # The packed tarball, installed in a container on the oldest supported Node (run.sh reads it from engines.node), syncing
  # over real ssh and rsync between two containers. The unit tests fake both. The Node set up here only packs it.
  linux-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci # npm pack in run.sh rebuilds dist/ with the dev dependencies
      - run: test/linux/run.sh

  # The one check the main ruleset requires, so changing the matrices above never leaves a PR waiting on a job that no
  # longer runs. It runs even when a job it needs fails, and fails unless every one of them succeeded.
  ci-ok:
    if: always()
    needs: [test, linux-smoke]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
